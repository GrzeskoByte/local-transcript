[workspace]
members = [".", "commands"]
resolver = "2"

[package]
name = "lt-server"
version = "0.1.27"
edition = "2021"
publish = false

[[bin]]
name = "lt-server"
path = "src/main.rs"

[dependencies]
lt-commands = { path = "commands" }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
