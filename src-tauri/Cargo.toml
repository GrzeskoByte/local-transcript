[package]
name = "local-transcribe"
version = "0.1.15"
edition = "2021"

[lib]
name = "local_transcribe_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
tauri-plugin-updater = "2"
# Native recording (src/recorder): capture + system audio on every OS, Opus encoding.
cpal = { version = "0.18", features = ["pulseaudio"] }
opus = "0.4"
