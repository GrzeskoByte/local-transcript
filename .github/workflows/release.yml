# Builds Local Transcriber for every platform and publishes ONE GitHub release
# per platform for the same version:
#   v<version>-windows  → x64 NSIS installer + MSI, ARM64 NSIS installer
#   v<version>-macos    → Apple Silicon + Intel .dmg
#   v<version>-ubuntu   → amd64 + arm64 .deb, .AppImage, .rpm
# Each release also carries SHA256SUMS.txt.
#
# Trigger: push a tag `v<version>` matching package.json / tauri.conf.json /
# Cargo.toml, or run manually (Actions → Release → Run workflow).
# Releases are created as DRAFTS by default: review, then publish.
name: Release

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
  workflow_dispatch:
    inputs:
      draft:
        description: Create the releases as drafts (review before publishing)
        type: boolean
        default: true
      prerelease:
        description: Mark the releases as pre-releases
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Check version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: version
        name: Versions must agree (and match the tag)
        run: |
          pkg=$(node -p "require('./package.json').version")
          conf=$(node -p "require('./src-tauri/tauri.conf.json').version")
          cargo=$(sed -n 's/^version = "\(.*\)"/\1/p' src-tauri/Cargo.toml | head -1)
          echo "package.json=$pkg tauri.conf.json=$conf Cargo.toml=$cargo"
          if [ "$pkg" != "$conf" ] || [ "$pkg" != "$cargo" ]; then
            echo "::error::Version mismatch — bump all three files together."; exit 1
          fi
          if [ "${GITHUB_REF_TYPE}" = "tag" ] && [ "${GITHUB_REF_NAME}" != "v$pkg" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match version v$pkg."; exit 1
          fi
          echo "version=$pkg" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.platform }} ${{ matrix.arch }}
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: windows, os: windows-latest,   target: x86_64-pc-windows-msvc,    arch: x64,   bundles: 'nsis,msi' }
          - { platform: windows, os: windows-latest,   target: aarch64-pc-windows-msvc,   arch: arm64, bundles: 'nsis' }
          - { platform: macos,   os: macos-latest,     target: aarch64-apple-darwin,      arch: arm64, bundles: 'dmg' }
          - { platform: macos,   os: macos-latest,     target: x86_64-apple-darwin,       arch: x64,   bundles: 'dmg' }
          - { platform: ubuntu,  os: ubuntu-22.04,     target: x86_64-unknown-linux-gnu,  arch: amd64, bundles: 'deb,appimage,rpm' }
          - { platform: ubuntu,  os: ubuntu-22.04-arm, target: aarch64-unknown-linux-gnu, arch: arm64, bundles: 'deb,appimage,rpm' }
    runs-on: ${{ matrix.os }}
    env:
      # AppImage tooling runs without FUSE on CI.
      APPIMAGE_EXTRACT_AND_RUN: '1'
    steps:
      - uses: actions/checkout@v4

      - name: Linux build dependencies
        if: matrix.platform == 'ubuntu'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev patchelf file

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: ${{ matrix.target }}

      - name: Install JS dependencies
        run: npm ci --ignore-scripts

      - name: Build app bundles
        run: npm run tauri:build -- --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}

      - name: Collect installers
        shell: bash
        run: |
          os_name=${{ matrix.platform }}
          [ "$os_name" = "ubuntu" ] && os_name=linux
          node scripts/collect-release.mjs \
            "src-tauri/target/${{ matrix.target }}/release/bundle" release \
            "${{ needs.prepare.outputs.version }}" "$os_name" "${{ matrix.arch }}"

      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.platform }}-${{ matrix.arch }}
          path: release/*
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish ${{ matrix.platform }} release
    needs: [prepare, build]
    # Publish each platform independently: a failed ARM build must not block the others.
    if: ${{ !cancelled() && needs.prepare.result == 'success' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: windows, title: Windows }
          - { platform: macos,   title: macOS }
          - { platform: ubuntu,  title: Ubuntu / Linux }
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: release-${{ matrix.platform }}-*
          merge-multiple: true
          path: release

      - name: Checksums and release notes
        id: files
        run: |
          shopt -s nullglob
          files=(release/*)
          if [ ${#files[@]} -eq 0 ]; then
            echo "::warning::No ${{ matrix.platform }} binaries were built — skipping this release."
            echo "skip=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          (cd release && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt)
          sed "s/{{VERSION}}/${{ needs.prepare.outputs.version }}/g" \
            ".github/release-notes/${{ matrix.platform }}.md" > notes.md
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - uses: softprops/action-gh-release@v2
        if: steps.files.outputs.skip == 'false'
        with:
          tag_name: v${{ needs.prepare.outputs.version }}-${{ matrix.platform }}
          name: Local Transcriber ${{ needs.prepare.outputs.version }} — ${{ matrix.title }}
          target_commitish: ${{ github.sha }}
          body_path: notes.md
          files: release/*
          fail_on_unmatched_files: true
          draft: ${{ github.event_name == 'workflow_dispatch' && inputs.draft || github.event_name == 'push' }}
          prerelease: ${{ github.event_name == 'workflow_dispatch' && inputs.prerelease }}
